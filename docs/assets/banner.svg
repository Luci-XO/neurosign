  <g fill="#4dd8c8">
    <circle cx="716" cy="182" r="6"/>
    <circle cx="900" cy="182" r="6"/>
    <circle cx="1067" cy="206" r="6"/>
  </g>
  <text x="84" y="146" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700">NeuroSign</text>
  <text x="88" y="198" fill="#b9c9e2" font-family="Segoe UI, Arial, sans-serif" font-size="27">Local voice and movement screening demo</text>
  <rect x="88" y="238" width="318" height="42" rx="21" fill="#143d51" stroke="#4dd8c8" stroke-opacity=".55"/>
  <text x="108" y="266" fill="#9ef3e8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">EDUCATIONAL · NOT A DIAGNOSIS</text>
