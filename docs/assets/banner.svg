<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">NeuroSign</title>
  <desc id="description">A blue gradient banner with a voice waveform, a guided spiral trace, and the text Local voice and movement screening demo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#163b68"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4dd8c8"/>
      <stop offset="1" stop-color="#7ba8ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="120" r="180" fill="#3266ac" opacity=".14"/>
  <circle cx="1110" cy="260" r="150" fill="#4dd8c8" opacity=".08"/>
  <g fill="none" stroke="url(#signal)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M715 182h28l12-37 18 73 19-105 20 142 19-100 19 52 16-25h34" stroke-width="5"/>
    <path d="M1004 184c0-53 77-75 111-39 41 44 2 112-48 109-40-2-53-48-28-70 19-16 45-7 46 12 1 11-7 20-17 20" stroke-width="4" opacity=".82"/>
